name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/ens ./cmd/enserie-relay

  # Packaging only runs on a tag, so a broken packer would otherwise be found
  # by whoever waits for a release. This builds every package and checks that
  # each one carries the client binary.
  packages:
    strategy:
      # Each runner reports on its own architecture. Cancelling the sibling on
      # the first failure hides one architecture's result behind the other's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install packers
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
      # rpm rejects a dash in Version, so a version like 0.0.0-ci cannot be
      # packed. That is worth knowing here rather than on a tag.
      - name: Package
        run: make dist-linux dist-rpm VERSION=0.0.0ci
      - name: Inspect packages
        run: |
          set -eu
          case "$(uname -m)" in
          x86_64) arch=amd64; rpm_arch=x86_64 ;;
          aarch64) arch=arm64; rpm_arch=aarch64 ;;
          *) echo "unknown runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          # Name one package at a time. A glob such as ens_*.deb matches both
          # architectures that dist-linux builds, and dpkg-deb takes one file.
          dpkg-deb -c "dist/ens_0.0.0ci_${arch}.deb" | grep -q usr/bin/ens
          if dpkg-deb -c "dist/ens_0.0.0ci_${arch}.deb" | grep -q enserie-relay; then
            echo "client deb must not contain enserie-relay" >&2
            exit 1
          fi
          rpm -qp --qf '%{ARCH} %{FILENAMES}\n' "dist/ens_0.0.0ci_${arch}.rpm" \
            | grep -qx "${rpm_arch} /usr/bin/ens"
          tar -tzf "dist/ens-linux-${arch}.tar.gz" | grep -qx ens

  # The unit tests never open a TUN, so a relay handshake that arrives in the
  # wrong order still passes them. This job runs two nodes in two network
  # namespaces and requires a packet to cross the overlay in both directions.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Build before sudo, because sudo resets PATH and the Go toolchain is not
      # on the secure path.
      - name: Build
        run: go build -o "$RUNNER_TEMP/ens" ./cmd/ens
      - name: End to end
        run: sudo "ENS_BIN=$RUNNER_TEMP/ens" ./scripts/e2e-overlay.sh

  dist-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        run: make dist-linux
      - name: Inspect packages
        run: |
          set -eu
          test -f dist/ens_0.0.0-dev_amd64.deb
          test -f dist/ens_0.0.0-dev_arm64.deb
          test -f dist/enserie-relay_0.0.0-dev_amd64.deb
          dpkg-deb -c dist/ens_0.0.0-dev_amd64.deb | grep -q usr/bin/ens
          if dpkg-deb -c dist/ens_0.0.0-dev_amd64.deb | grep -q enserie-relay; then
            echo "client deb must not contain enserie-relay" >&2
            exit 1
          fi
          tar -tzf dist/enserie-relay-linux-amd64.tar.gz | grep -qx enserie-relay
          if ls dist/ens-darwin-*.tar.gz >/dev/null 2>&1; then
            echo "linux job must not emit darwin tarballs" >&2
            exit 1
          fi

  packages-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        run: make dist-darwin VERSION=0.0.0-ci
      - name: Inspect packages
        run: |
          set -eu
          pkgutil --expand dist/ens_0.0.0-ci_arm64.pkg /tmp/ens-pkg
          pkgutil --flatten /tmp/ens-pkg /tmp/ens-flat.pkg
          grep -q 'identifier="dev.getfda.enserie.ens"' /tmp/ens-pkg/PackageInfo
          grep -q 'version="0.0.0-ci"' /tmp/ens-pkg/PackageInfo
          # brew style is what a tap submission is checked against, so a
          # formula that fails it here would fail on every brew install.
          brew style dist/ens.rb

  dist-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        run: make dist-darwin
      - name: Inspect packages
        run: |
          set -eu
          tar -tzf dist/ens-darwin-arm64.tar.gz | grep -qx ens
          tar -tzf dist/ens-darwin-amd64.tar.gz | grep -qx ens
          tar -tzf dist/enserie-relay-darwin-arm64.tar.gz | grep -qx enserie-relay
          codesign -dv dist/darwin-arm64/ens 2>&1 | grep -qi adhoc
          codesign -dv dist/darwin-amd64/ens 2>&1 | grep -qi adhoc
          dist/darwin-arm64/ens version
