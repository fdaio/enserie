name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Package
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Inspect packages
        run: |
          set -eu
          dpkg-deb -I dist/enserie_*_amd64.deb
          dpkg-deb -c dist/enserie_*_amd64.deb | grep -q usr/bin/enserie
          dpkg-deb -c dist/enserie_*_amd64.deb | grep -q enserie-relay && exit 1 || true
          tar -tzf dist/enserie-darwin-arm64.tar.gz | grep -qx enserie

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
