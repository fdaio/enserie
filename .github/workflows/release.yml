name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dist-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Package
        run: make dist-linux VERSION="${GITHUB_REF_NAME#v}"
      - name: Inspect packages
        run: |
          set -eu
          dpkg-deb -I dist/ens_*_amd64.deb
          # Both debs and both tarballs are built here. The rpm is a separate
          # job, so ask for the formats this job produced.
          for arch in amd64 arm64; do
            ./scripts/inspect-packages.sh "${GITHUB_REF_NAME#v}" "$arch" linux deb tarball
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/ens-linux-*.tar.gz
            dist/enserie-relay-linux-*.tar.gz
          # A path that matches nothing leaves an empty artifact and the job
          # still passes, which is how a release once shipped with no rpm.
          if-no-files-found: error

  # Distro rpm knows only the host architecture, so a spec whose BuildArch is
  # not the host one fails with "No compatible architectures found". There is
  # no rpmbuild flag that changes that, so each rpm is built on a runner of its
  # own architecture. ubuntu-24.04-arm is free for a public repository.
  dist-rpm:
    strategy:
      # Each runner builds one architecture. Cancelling the sibling on the
      # first failure hides that architecture's result.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Package
        run: make dist-rpm VERSION="${GITHUB_REF_NAME#v}" ARCH=${{ matrix.arch }}
      - name: Inspect packages
        # This job builds only the rpm, so check only the rpm.
        run: ./scripts/inspect-packages.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} linux rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          # Only ${{ }} is expanded here, so a shell parameter expansion would
          # reach the action as a literal string. Glob the version instead, and
          # keep the architecture in the pattern so the match stays exact.
          path: dist/ens_*_${{ matrix.arch }}.rpm
          if-no-files-found: error

  dist-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        run: make dist-darwin VERSION="${GITHUB_REF_NAME#v}"
      # This runner cannot produce the Linux tarballs the release ships, so
      # it does not check the formula. The publish job checks it, where all
      # four tarballs exist.
      - name: Inspect packages
        run: |
          set -eu
          codesign -dv dist/darwin-arm64/ens 2>&1 | grep -qi adhoc
          dist/darwin-arm64/ens version
          ./scripts/inspect-packages.sh "${GITHUB_REF_NAME#v}" arm64 darwin tarball pkg
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/ens-darwin-*.tar.gz
            dist/enserie-relay-darwin-*.tar.gz
            dist/ens_*.pkg
          if-no-files-found: error

  publish:
    needs: [dist-linux, dist-rpm, dist-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # The formula names all four tarballs, so it can only be generated here.
      # The darwin job cannot do it: a tarball built on this runner carries
      # this runner's timestamps, so its checksum is not the checksum of the
      # asset a user downloads.
      - name: Generate the formula
        run: ./scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist dist/ens.rb
      # brew style runs here because this is the one job that holds all four
      # tarballs. Homebrew is preinstalled on the Ubuntu runner but is not on
      # PATH, so the shell environment has to be loaded first.
      - name: Check the formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./scripts/inspect-packages.sh "${GITHUB_REF_NAME#v}" arm64 darwin formula
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: dist/ens.rb
          if-no-files-found: error
      # Every download path in the README names one of these files. A release
      # that is missing one installs on fewer platforms than the README claims,
      # and nobody notices until a user tries. This v0.2.10 shipped with no rpm
      # at all for exactly that reason.
      - name: Check every advertised file is here
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          missing=0
          for f in \
            "ens_${ver}_amd64.deb" "ens_${ver}_arm64.deb" \
            "ens_${ver}_amd64.rpm" "ens_${ver}_arm64.rpm" \
            "ens_${ver}_amd64.pkg" "ens_${ver}_arm64.pkg" \
            ens-linux-amd64.tar.gz ens-linux-arm64.tar.gz \
            ens-darwin-amd64.tar.gz ens-darwin-arm64.tar.gz \
            enserie-relay_${ver}_amd64.deb enserie-relay_${ver}_arm64.deb \
            enserie-relay-linux-amd64.tar.gz enserie-relay-linux-arm64.tar.gz \
            enserie-relay-darwin-amd64.tar.gz enserie-relay-darwin-arm64.tar.gz \
            ens.rb
          do
            if [ ! -f "dist/$f" ]; then
              echo "missing from the release: $f" >&2
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          ls -lh dist
      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.pkg
            dist/ens.rb
            dist/SHA256SUMS

  # The tap is a separate repository, so this cannot use GITHUB_TOKEN, which is
  # scoped to this one. TAP_SSH_KEY holds the private half of a deploy key that
  # has write access to fdaio/homebrew-enserie and to nothing else.
  #
  # This runs after publish on purpose. The release is already out, so a tap
  # failure leaves brew install on the previous version and says so, rather than
  # holding a finished release hostage.
  tap:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The formula is the one the release checked and published, so the tap
      # cannot serve a different one than the release page describes.
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: dist
      - name: Check the tap key
        env:
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${TAP_SSH_KEY:-}" ]; then
            echo "TAP_SSH_KEY is not set, so the tap would keep serving the previous version." >&2
            echo "Add it as the TAP_SSH_KEY secret of fdaio/enserie." >&2
            echo "CONTRIBUTING.md describes the deploy key it must hold." >&2
            exit 1
          fi
      - name: Update the tap
        env:
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
        run: |
          set -eu
          # The key is written outside the checkout, so a later step cannot
          # read it back out of the working tree.
          (umask 077; printf '%s\n' "$TAP_SSH_KEY" >"$RUNNER_TEMP/tap_key")

          # The host key is compared with the fingerprints GitHub publishes
          # before it is trusted, because a scan on its own accepts whatever
          # the network answers with.
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >"$RUNNER_TEMP/known_hosts" 2>/dev/null
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}' | sort -u >"$RUNNER_TEMP/scanned"
          printf '%s\n' \
            'SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s' \
            'SHA256:p2QAMXNIC1TJYWeIOttrVc98/R1BUFWu3/LiyKgUfQM' \
            'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' | sort >"$RUNNER_TEMP/expected"
          if [ ! -s "$RUNNER_TEMP/scanned" ]; then
            echo "the GitHub host key could not be read" >&2
            exit 1
          fi
          # ssh-keygen skips a line it cannot read, so the key line count is
          # held against the fingerprint count. An entry that is not counted
          # here must not reach the connection either. The scan writes a
          # comment line above every key, so comments do not count.
          keylines=$(awk '!/^#/ && NF {n++} END {print n+0}' "$RUNNER_TEMP/known_hosts")
          listed=$(wc -l <"$RUNNER_TEMP/scanned" | tr -d ' ')
          if [ "$keylines" -ne "$listed" ]; then
            echo "a host key line could not be read" >&2
            exit 1
          fi
          if grep -vxF -f "$RUNNER_TEMP/expected" "$RUNNER_TEMP/scanned"; then
            echo "the GitHub host key does not match the fingerprint GitHub publishes" >&2
            exit 1
          fi
          install -m 600 "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"

          # The key stays out of the remote URL, which git would otherwise
          # print when a clone fails.
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone --depth 1 git@github.com:fdaio/homebrew-enserie.git tap
          cp dist/ens.rb tap/Formula/ens.rb
          cd tap
          git config user.name "fdaio"
          git config user.email "noreply@getfda.dev"
          if git diff --quiet; then
            echo "the tap already serves this version"
            exit 0
          fi
          git commit -am "Update the ens formula to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
